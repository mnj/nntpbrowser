name: CI

on:
  push:
    # Main is covered by Release, which calls this reusable workflow.
    branches-ignore: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install native desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libwayland-dev libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --all-features --locked
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo build --locked -p app --bin nntpbrowser

  publishing-checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Check release and packaging scripts
        run: |
          bash -n scripts/*.sh scripts/tests/*.sh packaging/*.sh packaging/tests/*.sh
          bash scripts/tests/version.sh
          python3 scripts/tests/notices.py
          bash packaging/tests/linux.sh
          bash packaging/tests/flatpak.sh
          python3 packaging/tests/portable-zip.py
      - name: Validate project site links
        run: python3 scripts/check-site.py

  windows:
    name: Windows ${{ matrix.arch }} native build
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            msvc: amd64
          - arch: x86
            runner: windows-2022
            target: i686-pc-windows-msvc
            msvc: amd64_x86
          - arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            msvc: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-windows-${{ matrix.arch }}
      - name: Compile desktop and console entry points
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --locked --target "$env:TARGET" -p app --bin nntpbrowser --bin nntpbrowser-cli
      - name: Check Windows packaging script syntax and CLI version
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          $Tokens = $null
          $ParseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/packaging/build-windows.ps1", [ref]$Tokens, [ref]$ParseErrors) | Out-Null
          if ($ParseErrors.Count -gt 0) { throw ($ParseErrors | Out-String) }
          & "target/$env:TARGET/debug/nntpbrowser-cli.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "CLI smoke failed" }
      - name: Native application tests
        env:
          TARGET: ${{ matrix.target }}
        run: cargo test --locked --target "$env:TARGET" -p app --lib

  macos:
    name: macOS ${{ matrix.runner }} native build
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-${{ matrix.runner }}
      - run: cargo build --locked -p app --bin nntpbrowser
      - run: target/debug/nntpbrowser --version
      - run: cargo test --locked -p app --lib
