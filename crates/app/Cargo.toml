[package]
name = "app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "nntpbrowser"
path = "src/main.rs"

[[bin]]
name = "nntpbrowser-cli"
path = "src/bin/nntpbrowser-cli.rs"

[dependencies]
eframe = "0.36"
engine = { path = "../engine" }
directories = "6"
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }

[features]
ui-preview = ["eframe/glow"]

[[example]]
name = "preview"
required-features = ["ui-preview"]
